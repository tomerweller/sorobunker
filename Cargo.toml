[workspace]
resolver = "2"
members = ["contracts/*", "client"]

[workspace.dependencies]
soroban-sdk = "29.0.0"
sorobunker-client = { path = "client" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
