[package]
name = "sorobunker-client"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[lib]
name = "sorobunker_client"

[[bin]]
name = "sorobunker"
path = "src/main.rs"

[dependencies]
sha2 = "0.10"
hex = "0.4"
stellar-strkey = "0.0.18"
clap = { version = "4", features = ["derive"] }
getrandom = "0.3"
serde_json = "1"
ed25519-dalek = "2"
