<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SoroBunker</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23c2410c' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='4' width='18' height='16' rx='3'/%3E%3Ccircle cx='12' cy='12' r='3.5'/%3E%3Cpath d='M12 8.5V7M12 17v-1.5M15.5 12H17M7 12h1.5'/%3E%3C/svg%3E" />

  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="./">

            <rect x="3" y="4" width="18" height="16" rx="3" />
            <circle cx="12" cy="12" r="3.5" />
            <path d="M12 8.5V7M12 17v-1.5M15.5 12H17M7 12h1.5" />

          SoroBunker

        <span class="badge warn">Testnet</span>
        <div id="wallet" class="wallet"></div>

    </header>

    <main id="main"></main>

    <footer class="footer">
      A vault guarded by a hidden, rotating key. Experimental and unaudited.
      <a href="https://github.com/tomerweller/sorobunker" target="_blank" rel="noopener">Source</a>
    </footer>

    <dialog id="sheet" class="sheet" aria-labelledby="sheet-title"></dialog>
    <div id="toasts" class="toasts" aria-live="polite"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
